# What `aigarden check` holds this repo to: link integrity, size budgets, and prose style.
# `aigarden rules` lists every rule and `aigarden explain <rule>` gives its config keys. An
# unknown key here is a load error rather than a setting that quietly does nothing, so a typo
# fails the run instead of turning a rule off.

[markdown-style]
# One physical line per paragraph. A reworded sentence is then a one-line diff, and an AI
# author writing beside our prose mirrors the convention it reads. Fences and tables keep
# their line breaks, so a diagram or a table is never rewrapped.
reflow = "never-wrap"

[file-length.extend-budgets]
# The one reference document: `docs/schema.md` is read a field at a time, and its tables are
# generated from `src/aiobserve/extract/records/`, so the meanings and citations it prints are
# the models' and not a writer's to cut. It carries a raised ceiling rather than an exemption —
# reaching this one means splitting the reading rules out of it, not raising it again.
"docs/schema.md" = { tokens = 9000 }

[per-file-ignores]
# Historical documents: a plan describes the repo as it was, so a path it cites is allowed to
# have moved, and reflowing one would churn history nobody reads again. Most of the repo's
# hard-wrapped prose lives here.
"plans/**" = ["bare-path", "file-length", "markdown-style"]
# A report cites the corpus and the repo at the time of the analysis, for the same reason.
# Style stays on: reports are still read.
"reports/**" = ["bare-path"]
# Prompt templates: their bytes are model input. A reflow would change the prompt and stale
# every enrichment stamp derived from it (`docs/enrichment.md`).
"src/aiobserve/analyze/templates/**" = ["markdown-style"]
