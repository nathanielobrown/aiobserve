# Task conventions
#
# mise's own flags must come BEFORE the task name — `mise run --force check`, not
# `mise run check --force`. A flag that trails the task name is passed to the task
# as an argument and silently does nothing. The tasks that take an argument
# declare it — `diagram-*` a file, `mutate` optional mutant globs — so a trailing
# flag on any other task is a mistake.
#
# `mise run a ::: b` runs a and b in parallel.

[tools]
python = "3.13"
# Exact, not `latest`: mise freezes a `latest` resolve permanently, so the version a machine
# runs depends on when it first installed. A bump is this line changing.
uv = "0.10.11"
# The doc gates — links, size budgets, prose style, and the cog splice (`aigarden.toml`).
# Exact for the same reason, and doubly so pre-1.0: an unknown config key is a load error, so
# an unplanned version change fails the run rather than quietly checking something else.
"github:nathanielobrown/aigarden" = "0.1.4"

[settings]
python.uv_venv_auto = true
# aigarden is ours, so a release we just cut is the one we want — no soak period to wait out.
minimum_release_age_excludes = ["github:nathanielobrown/aigarden"]

[tasks.sync]
description = "Install/refresh the virtualenv from uv.lock"
run = "uv sync --all-groups"

[tasks.format]
description = "Format Python with ruff"
run = "uv run ruff format ."

[tasks.format-check]
description = "Check Python formatting without writing"
run = "uv run ruff format --check ."

[tasks.format-html]
description = "Format the viewer's templates with djLint"
# The paths are named rather than a bare `.`: djLint would otherwise walk the docs and the
# gitignored `data/`. `[tool.djlint]` in `pyproject.toml` decides how, and VS Code formats
# on save through this same binary and that same block, so an editor's output is this output.
# `--quiet` drops the per-file diff — `git diff` says it better. The trailing test swallows
# djLint's exit 1, which is what it returns when it rewrote a file: a formatter doing its job,
# not something that should stop `check-fast`. A real error still exits 2 and still fails.
run = "uv run djlint src/aiobserve/view/templates tests/gallery/index.html --reformat --quiet || [ $? -eq 1 ]"

[tasks.format-html-check]
description = "Check template formatting without writing (the CI shape)"
run = "uv run djlint src/aiobserve/view/templates tests/gallery/index.html --check"

[tasks.lint]
description = "Lint Python with ruff, applying safe fixes"
run = "uv run ruff check --fix ."

[tasks.lint-check]
description = "Lint Python with ruff, no fixes (the CI shape)"
run = "uv run ruff check ."

[tasks.typecheck]
description = "Type-check with pyrefly"
# What gets checked is `project-includes` in `pyproject.toml`, which is also what makes a bare
# run safe inside a gitignored agent worktree: the config turns pyrefly's ignore-file and
# exclude heuristics off, so naming paths here would only be a second place to keep in step.
run = "uv run pyrefly check"

[tasks.lint-docs]
description = "Lint the docs with aigarden — links, size budgets, prose style — applying fixes"
# The prose formatter as well as the linter: `--fix` rejoins a paragraph someone hard-wrapped,
# which is the never-wrap convention `aigarden.toml` configures. What each rule holds the repo
# to is in that file; `aigarden rules` lists them.
run = "aigarden check --fix"

[tasks.lint-docs-check]
description = "Lint the docs, no fixes (the CI shape)"
run = "aigarden check"

[tasks.cogs]
description = "Regenerate every generated block in the docs from its generator"
# The blocks and the generators behind them: `docs/documentation.md`. Writing and checking are
# separate commands in aigarden by design, so this one never runs in `check`.
run = "aigarden cog --write"

[tasks.cogs-check]
description = "Fail when a generated block no longer matches what its generator prints"
run = "aigarden cog --check"

[tasks.mv-doc]
description = "Move a doc and rewrite every reference to it across the repo"
# `git mv` plus the rewrite, then a re-check that the repo's links still resolve. Files only.
usage = '''
arg "<src>" help="file to move"
arg "<dst>" help="destination path, or a directory (trailing /) to move into"
'''
run = 'aigarden mv "$usage_src" "$usage_dst"'

[tasks.lint-shell]
description = "Lint the Claude Code hook scripts with shellcheck"
# The hooks run on every tool call; a syntax error there is invisible until it
# silently stops firing. Skipped when shellcheck isn't installed.
run = """
if command -v shellcheck >/dev/null; then
  shellcheck .claude/hooks/*.sh
else
  echo 'shellcheck not installed — skipping (brew install shellcheck)'
fi
"""

[tasks.diagram-check]
description = "Validate a Mermaid file or Markdown's ```mermaid blocks by rendering it"
# mmdc validates by rendering, so a non-zero exit is a syntax error. Deliberately
# out of `check` — it needs network on first run and a Chrome; call it when you
# author a diagram (docs/mermaid-guide.md).
usage = 'arg "<file>" help="Mermaid or Markdown file to validate"'
run = """
out="$(mktemp -d)/check.svg"
npx -y @mermaid-js/mermaid-cli -i "$usage_file" -o "$out" >/dev/null && echo 'diagram-check: valid'
"""

[tasks.diagram-render]
description = "Render a Mermaid file to PNGs and print their paths, for layout inspection"
usage = 'arg "<file>" help="Mermaid or Markdown file to render"'
# The paths come from `ls`, not from `-o`: a Markdown input renders one PNG per ```mermaid
# block, named `diagram-1.png` upward, and the name passed to `-o` is then written by nothing.
run = """
dir="$(mktemp -d)"
npx -y @mermaid-js/mermaid-cli -s 2 -i "$usage_file" -o "$dir/diagram.png" >/dev/null \
  && ls "$dir"/*.png
"""

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.gallery]
description = "Serve the test fixtures' scenario pages in a browser, with live reload"
# The UI development loop: every scenario `tests/view/scenarios.py` pins, as a page you can
# edit a template against and watch reload on save (`tests/gallery/serve.py`). Run as a module
# so `tests.conftest` imports the way it does under pytest. It builds its own store from the
# redacted fixtures and reads no environment — pointing it at private data is not possible.
# A port is all it takes, and the default is the process's, so the task names no number.
usage = 'flag "--port <port>" help="listen here instead of the gallery default"'
run = 'uv run python -m tests.gallery.serve ${usage_port:+--port "$usage_port"}'

[tasks.mutate]
description = "Mutation-test the source this branch changed; pass mutant globs to scope it yourself"
# Asks what a green suite cannot: would a leaf notice the code being wrong? Deliberately out
# of `check` — it re-runs the covering tests once per mutant. Whole-branch scope by default,
# because a run over the package takes hours; `mise run mutate 'aiobserve.sessions.*'` narrows
# it. mutmut names a mutant `<module path>.x_<function>__mutmut_<n>`, and a method's
# `<module path>.xǁ<Class>ǁ<method>__mutmut_<n>`; it takes globs over that.
# Read the survivors with `uv run mutmut browse`.
usage = 'arg "[mutants]" var=#true help="mutant globs to score, e.g. aiobserve.view.format.*"'
run = """
# `set -f` throughout: a mutant name ends in `*`, and an unquoted one the shell expands is a
# name no mutant has. mise hands a variadic arg over shell-escaped, so `eval` is what undoes
# the escaping — under `set -f` it splits the words without expanding one.
set -f
eval "set -- ${usage_mutants:-}"
if [ "$#" -eq 0 ]; then
  set -- $(git diff --name-only --diff-filter=d "$(git merge-base HEAD main)" -- 'src/aiobserve/*.py' \
    | sed -e 's|^src/||' -e 's|\\.py$||' -e 's|/|.|g' -e 's|$|.*|')
  if [ "$#" -eq 0 ]; then
    echo 'mutate: nothing to do — this branch changes no file under src/aiobserve, so the'
    echo '        default scope is empty. Pass a mutant glob, e.g.'
    echo "        mise run mutate 'aiobserve.view.format.*'"
    exit 1
  fi
  echo "mutate: branch scope $*"
fi
# Every run is cold: mutmut caches verdicts in `mutants/src/**/*.py.meta` and timings in
# `mutants/mutmut-stats.json`, and the tree also holds the copied `__pycache__`, where a stale
# .pyc can shadow a same-size mutant and score a kill that never ran. Costs ~20s per run.
rm -rf mutants
# One child at a time, because the number is the point. Run in parallel, the same cold scope
# gave 7, 9 and 10 survivors over three runs; serial it gives the same 13 every time — the
# parallel runs were scoring kills the suite did not earn. Costs about 3x wall.
#
# `no_proxy` because mutmut runs each mutant in a forked child, and macOS crashes a forked
# process that asks SystemConfiguration for the system proxies — which is what httpx does when
# it builds a client and no proxy env var is set. Unset, every mutant scores 💥 segfault
# instead of a verdict. Any `*_proxy` variable short-circuits the lookup; this one also tells
# httpx to bypass proxies for every host, which is what a run that never leaves the machine
# wants anyway.
no_proxy='*' uv run mutmut run --max-children 1 "$@"
"""

[tasks.check-fast]
description = "Format and lint the code and the docs, and type-check — the loop to run while iterating"
depends = ["format", "format-html", "lint", "lint-docs", "typecheck"]

[tasks.check]
description = "Every gate. Run before opening a PR."
depends = [
  "format-check",
  "format-html-check",
  "lint-check",
  "lint-docs-check",
  "cogs-check",
  "typecheck",
  "lint-shell",
  "test",
]
