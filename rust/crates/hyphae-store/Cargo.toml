[package]
name = "hyphae-store"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
hyphae-model.workspace = true
# `analyze/macros.py` generates the `context_window` macro from `extract/pricing.py`'s table;
# this crate's port of that module does the same, so the price table is the dependency.
hyphae-extract.workspace = true
duckdb.workspace = true
chrono.workspace = true
thiserror.workspace = true
# The query manifest, compiled in as the JSON Python generates it into
# (`src/manifest.rs`) rather than restated here.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The shared store cache, and the row helpers that compare two stores without printing one.
hyphae-testsupport.workspace = true
tempfile.workspace = true
