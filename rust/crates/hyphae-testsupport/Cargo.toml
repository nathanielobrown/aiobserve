[package]
name = "hyphae-testsupport"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
# The store cache builds a corpus the way the pipeline does, and serves it the way `hp` does.
# Every crate here dev-depends back on this one; cargo allows the cycle because the edge that
# closes it is a dev-dependency.
hyphae-model.workspace = true
hyphae-extract.workspace = true
hyphae-store.workspace = true
# The enrichment tables and the upsert that plants a row in them.
hyphae-enrich.workspace = true
hyphae-view.workspace = true
axum.workspace = true
duckdb.workspace = true
tempfile.workspace = true
tower.workspace = true
# The cache key, and the digest `build.rs` takes over the sources behind it.
sha2.workspace = true
# The generated metadata registries, read back out of the JSON they cross as.
serde.workspace = true
serde_json.workspace = true
# Reading a served page back: the twin of `tests/view/conftest.py`'s HTML reader.
scraper.workspace = true
regex.workspace = true
html-escape.workspace = true

[build-dependencies]
sha2.workspace = true
