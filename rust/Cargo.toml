[workspace]
resolver = "3"
members = ["crates/hp", "crates/hyphae-extract", "crates/hyphae-model", "crates/hyphae-store", "crates/hyphae-view"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
# The crates, by path: the workspace is the only consumer and nothing here is published.
hyphae-model = { path = "crates/hyphae-model" }
hyphae-extract = { path = "crates/hyphae-extract" }
hyphae-store = { path = "crates/hyphae-store" }
hyphae-view = { path = "crates/hyphae-view" }
# The store. `bundled` compiles DuckDB itself, so the binary carries no libduckdb; the
# version tracks DuckDB releases and 1.10505.0 is DuckDB 1.5.5, the version `pyproject.toml`
# pins — a store file is only readable by a build at or past the one that wrote it.
duckdb = { version = "1.10505.0", features = ["bundled", "chrono"] }
# TIMESTAMPTZ in and out of DuckDB; `DateTime<Utc>` is the only instant type this crate uses.
chrono = "0.4"
# Typed errors at the crate seam, per the design's `thiserror` (crates) / `anyhow` (bin) split.
thiserror = "2"
# Scratch stores for tests: one directory per test, removed on drop.
tempfile = "3"
# Transcript records, read as the dicts they are. `preserve_order` keeps a tool input's keys
# in the recorded order, which is what `json.dumps` writes and what the store row must match.
# The query-string knobs a node-page URL carries; axum's `Query` extractor deserializes them.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Snapshots of the ids and parents the walk produced, reviewed once and then pinned.
insta = "1"
# The `hp` binary's CLI. `derive` is the only feature the commands need.
clap = { version = "4", features = ["derive"] }
# Errors at the binary, per the design's `thiserror` (crates) / `anyhow` (bin) split.
anyhow = "1"

# The viewer's web half. `Router` is a `tower::Service`, so the view tier drives it with
# `oneshot` and never binds a port.
axum = "0.8"
# axum's runtime, and the only async in the workspace: everything else is sync, as the Python
# viewer is.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
# The markup. `rsx!` checks tag and attribute names at compile time and components stay plain
# functions.
hypertext = { version = "0.12", features = ["htmx", "axum"] }
# Markdown, for the prose and the titles a session wrote. The Rust port of the same
# markdown-it the Python viewer reads with, so `view/render.py`'s settings — CommonMark, no
# HTML passthrough, no linkify — port as settings rather than as an approximation.
markdown-it = "0.6"
# Driving the router without a server, the way `TestClient` drives the Python app.
tower = { version = "0.5", features = ["util"] }

[profile.dev]
# The spike copies whole tables through DuckDB; unoptimized debug builds make that slow
# enough to distort the timings the prototype is meant to measure.
opt-level = 1
