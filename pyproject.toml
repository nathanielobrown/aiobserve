[project]
name = "hyphae"
version = "0.1.0"
description = "Analyze AI coding agents from their telemetry to find ways to make them better"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "duckdb>=1.5.5", # the local trace store — an embedded analytical DB, so no service to run
  "pytz>=2025.2",  # duckdb needs it to hand a TIMESTAMPTZ back to Python, but doesn't declare it
  "python-dotenv>=1.1", # reads the OTLP backends' ingest keys out of .env, which is gitignored
  "fastapi>=0.115", # the trace viewer's routes, and the test client the viewer tier drives
  "uvicorn>=0.34", # serves the viewer on localhost; nothing here is deployed
  "jinja2>=3.1", # the viewer's templates, autoescaping every value a transcript wrote
  # Renders a transcript's markdown with HTML passthrough and the image rule off — see
  # `view/render.py`, which is the only place the reader is configured.
  "markdown-it-py>=3.0",
  # Jinja's escaping, used directly: `view/render.py` returns HTML it has escaped itself.
  "markupsafe>=3.0",
  # The OTLP wire types only — `TracesData` and `ExportTraceServiceResponse`. Deliberately
  # not `opentelemetry-sdk`: its BatchSpanProcessor queue drops spans silently, and its
  # exporter discards `partial_success` (plans/otlp-export/design.md).
  "opentelemetry-proto>=1.30",
  # POSTs the OTLP batches, and the viewer's test client rides on it.
  "httpx>=0.28",
  # Highlights the JSON a tool wrote and the SQL behind a page (`view/highlight.py`). Class
  # names only, never inline styles: the viewer's CSP allows no `style` attribute.
  "pygments>=2.19",
  # Describes Claude Code's raw record shapes in `extract/records/` — field descriptions and
  # the evidence behind them, which `tools/gen_schema.py` renders as `docs/schema.md`'s tables.
  # Describing only: the extractor still reads records as dicts.
  "pydantic>=2.13.4",
]

[project.scripts]
hp = "hyphae.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-timeout>=2.4", # backs the `timeout` setting below
  # Floor at 1.0: the config below uses the 1.x spellings — `preset`, a severity map under
  # `[tool.pyrefly.errors]`, and `sub-config` — which 0.x neither reads nor rejects.
  "pyrefly>=1.0",
  # Exact, not a floor: a ruff release adds rules to the groups selected below, so an upgrade
  # is a change to what the gate demands. It lands when someone bumps this line.
  "ruff==0.16.1",
  # The viewer's HTML formatter — `mise run format-html`, and the binary VS Code runs on save
  # (`.vscode/settings.json`). Exact for ruff's reason and one more: it reflows markup no test
  # here pins byte for byte, so a release's output lands when someone bumps this line and
  # re-reads the pages.
  "djlint==1.44.2",
  # Mutation testing — `mise run mutate`. Answers what a green suite cannot: whether a leaf
  # would notice the code being wrong. Outside `check`, because it costs a test run per mutant.
  "mutmut>=3.7",
  # Watches the templates and the stylesheets behind `hp view --dev` (`view/dev.py`).
  # A dev-group dependency deliberately: the shipped viewer never imports it, so `--dev` in a
  # checkout without these deps fails at startup rather than serving a loop that never fires.
  "watchfiles>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Ruff formats Python inside Markdown code blocks. Our guides use those blocks for
# illustration — placeholder pseudo-code, deliberate ❌/✅ pairs — so leave them alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Curated groups, not `ALL`: each one here has to earn the fixes it demands, and the groups
# left out are named under `ignore` with the reason. `ruff rule <code>` explains any of them.
select = [
  # E501 included: the formatter breaks what it can, and what is left over — a long string,
  # a URL in a comment — is where the 100-column reading width actually needs defending.
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort — one import order, enforced rather than argued about
  "UP",    # pyupgrade — keep syntax current with the pinned interpreter
  "B",     # bugbear
  "SIM",   # simplify
  "TID",   # tidy-imports — bans relative imports (see flake8-tidy-imports below)
  "A",     # builtins — a local named `input` shadows the function used beside it
  "ASYNC", # blocking calls inside the viewer's async routes
  "BLE",   # blind except — the fail-fast rule, enforced
  "C4",    # comprehensions
  "DTZ",   # naive datetimes — every timestamp we read carries a zone, so ours must
  "ERA",   # commented-out code
  "EXE",   # shebang and +x agreement — the hooks and `tools/` scripts are run both ways
  "FLY",   # `"".join` over literals, which an f-string says in one piece
  "FURB",  # refurb — modernizations pyupgrade doesn't cover
  "G",     # logging call shape
  "ICN",   # import aliases — the conventional short name, or the full one
  "INP",   # a package directory has an `__init__.py`; every one here does
  "LOG",   # logging misuse
  "N",     # pep8 naming
  "PERF",  # loops that build what a comprehension would
  "PGH",   # blanket `noqa` and bare `type: ignore` — a suppression names its rule
  "PIE",   # small dead-weight constructs
  "PLC",   # pylint conventions
  "PLE",   # pylint errors
  "PLW",   # pylint warnings
  "PT",    # pytest style — the suite is most of the repo
  "PTH",   # pathlib over os.path
  "RET",   # return paths
  "RSE",   # raise
  "RUF",   # ruff's own, including stale `noqa` directives
  "S",     # bandit — this repo shells out, renders HTML, and holds private session data
  "SLF",   # private member access across objects
  "T10",   # a `breakpoint()` that rode along in a commit
  "T20",   # stray print
  "TRY",   # exception antipatterns
  "YTT",   # version checks that read `sys.version[2]` and break on 3.10
]
# Each entry is a rule we looked at and rejected, with the reason. Whole groups left out of
# `select` for the same kind of reason: PLR (its ceilings on arguments, returns and magic
# values fire ~240 times, nearly all in tests, where a literal is the assertion), D and ANN
# (docstrings and annotations by mandate — house style writes both where they help, and
# pyrefly checks the types that exist; even with D's D1 presence rules dropped, the shape
# rules ask for 409 rewrites, 324 of them D401's imperative mood), EM and TRY003 (a variable
# per raise site buys a tidier traceback and costs the message its place), ARG (FastAPI
# handlers, markdown-it render rules and pytest fixtures all keep parameters they never
# read), ISC (ISC001 fights the formatter, and ISC004 — the missing-comma catch — fires on
# 63 deliberate multi-line strings inside list literals, wrapping each in parentheses and an
# extra indent for a bug the suite has never seen), TC (moving an
# import into `if TYPE_CHECKING` breaks FastAPI and Pydantic, which read annotations at
# runtime — and we don't import `annotations` from `__future__`), and COM/Q (the formatter
# owns commas and quotes).
ignore = [
  # Our SQL is assembled from module constants and closed sets — `view/listing.py` documents
  # the membership check that guards the one request-shaped composition, and every value a
  # request supplies is bound as a parameter. The rule sees only the f-string.
  "S608",
  # Exception names read as the condition they report (`StoreLocked`, `SchemaMoved`). The
  # `Error` suffix would add a syllable and no information.
  "N818",
  # A raise says what went wrong at the place it went wrong. Hoisting the message into a
  # variable first buys a tidier traceback and costs the reader the sentence.
  "TRY003",
  # One assertion is often one claim — "this page lists projects and no sessions". Splitting
  # it in two restates the claim rather than sharpening the failure.
  "PT018",
  # `–`, `×` and `❯` are the viewer's own typography, and the tests assert on what it prints.
  "RUF001",
  "RUF002",
  "RUF003",
]
# Unused imports are never auto-removed: the ruff-fix hook runs `--fix` on every
# Claude edit, and silently deleting an import mid-refactor hides the mistake.
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
# The CLI's output is its interface, and the generators print the block `aigarden cog` splices.
"src/hyphae/cli.py" = ["T201"]
"tools/*" = ["T201"]
# The record models spell Claude Code's field names exactly, camelCase and all, because that
# is what a transcript holds (`src/hyphae/extract/records/`).
"src/hyphae/extract/records/*" = ["N815"]
# Tests are not an attack surface: `assert` is the point, a subprocess is the fixture, and a
# `/tmp` path is a value a test invents. Everything else bandit checks stays on in `src/`.
"tests/**" = ["S"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
# Format the code inside docstrings too. A usage example that has drifted out of the house
# style reads as if it were quoted from somewhere else; this keeps it looking like the module
# around it. Markdown is excluded above, so this reaches docstrings only.
docstring-code-format = true

# The viewer's templates and `tests/gallery/index.html` — `mise run format-html` writes what
# `format-html-check` gates and VS Code runs on save. Formatter only: djLint's linter wants
# `{{ url_for() }}` for every internal link, and this viewer builds its URLs in
# `src/hyphae/view/nodes.py` on purpose.
[tool.djlint]
# Jinja, not HTML: this is what makes `{% %}` a tag djLint indents rather than text it reflows,
# and what keeps `{%- -%}` intact.
profile = "jinja"
# Two, not djLint's four. The templates and the stylesheet beside them are written at two, and
# a NavTree row nested six deep would otherwise start past column 24.
indent = 2
# Everything else stays default. An unknown key here is ignored silently, unlike `aigarden.toml`
# and `mise.toml`, so a typo turns a setting off and says nothing. djLint also reads an
# `.editorconfig` if one appears; this repo has none, and an `[*.html]` section added later must
# agree with `indent` above or this block stops deciding.

[tool.pytest.ini_options]
testpaths = ["tests"]
# A hung test with no ceiling burns the whole run and prints no failure line.
# This is a backstop; individual waits carry their own deadlines. Kept well clear of both:
# the slowest test in the suite takes 20s, so a trip always means nothing here was bounded
# and never preempts an inner deadline's own diagnostic.
timeout = 120
# SIGALRM raises inside the test, so a trip is a red test with a stack and the run still
# reports. pytest-timeout's other method kills the process outright. It already picks this
# one wherever SIGALRM exists — naming it means a platform or a plugin release cannot quietly
# turn the backstop into a killed run.
timeout_method = "signal"
addopts = "--strict-markers --durations=10"
filterwarnings = [
  # A warning is a finding: something we call is on its way out, or a value is the wrong
  # shape. Raising them keeps a deprecation from riding along unread until the release that
  # removes it. Each exemption below names what it excuses and when it can go.
  "error",
  # Starlette 1.4's test client prefers `httpx2` and warns at import when only `httpx` is
  # installed (starlette/testclient.py:48). Nothing we call is deprecated — the viewer and the
  # OTLP exporter ship httpx in production — so this says only that the test client would like
  # a second HTTP stack in the dev environment. Drop this line if we ever install one.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
markers = [
  "slow: earned its runtime (real subprocess, network, or large corpus) — needs a why-comment",
  "live: opts in to a real remote call (Anthropic API, an OTLP backend) — billed, so it needs an env var as well",
]

[tool.mutmut]
# What `mise run mutate` mutates when it is given no scope of its own. mutmut copies the tree
# into `mutants/` (gitignored) and re-runs, per mutant, only the tests that cover the mutated
# line. Config keys are 3.x's: `paths_to_mutate` and `tests_dir` are the deprecated 2.x names.
source_paths = ["src/hyphae"]
# The suite is the oracle, so a mutant that survives is a gap in it. `-x` stops at the first
# test that catches the mutant, which is all a kill needs.
pytest_add_cli_args = ["-x", "-p", "no:cacheprovider"]
# mutmut copies `src`, `tests` and `pyproject.toml` and nothing else, so a test that reads a
# repo file reads it out of `mutants/` and finds it missing. The stylesheet gate in
# `tests/view/test_query.py` highlights this repo's own prose, task lines and hook scripts:
# without `mise.toml` it dies on the read, and without `docs` it fails outright. The hooks it
# reaches by glob, which goes quietly empty — it passes today either way, but only over the
# commands that are left. mutmut skips a path that does not exist just as quietly, so check
# `mutants/` holds what this list promises rather than trusting a green run.
# `tools/` is here because five test modules import it, and `aigarden.toml` because the
# config test reads it.
also_copy = ["mise.toml", "docs", ".claude/hooks", "tools", "aigarden.toml"]

[tool.pyrefly]
# Strict is the base: it adds the checks that catch an implicit `Any` slipping through an
# annotation, which is what a type checker is here to notice. `pyrefly check --preset default`
# shows what it costs to run without them.
preset = "strict"
# A display threshold, not a gate: a warn never reaches the exit code. The default value
# hides warns outright, so a kind pyrefly adds in a future release would arrive invisible.
# Showing them is what keeps the rule below true — every kind is either promoted to an error
# or turned off with a reason, and none sits in a middle tier nobody reads.
min-severity = "warn"
# Pyrefly honors `.gitignore`, and `.claude/worktrees/` is in ours: a bare `pyrefly check`
# from inside an agent worktree would match no file and pass having read nothing. With both
# of these off, `project-includes` is the only thing deciding what gets checked.
use-ignore-files = false
disable-project-excludes-heuristics = true
# `tools/` is in: a cog generator prints a table into a document, so a shape error there
# ships a wrong table instead of raising.
project-includes = ["src", "tests", "tools"]
# The repo root as well as `src`: test modules import shared scaffolding from
# `tests.conftest`, which pyrefly cannot see from the inferred `src` root alone.
search-path = ["src", "."]

[tool.pyrefly.errors]
# Promoted from warn: `check` is the only place these are read, and a finding that prints
# without failing is a finding nobody acts on. Everything warn-level is here, so the list
# grows when a pyrefly release adds a kind — which is the point of `min-severity` above.
deprecated = "error"
division-by-zero = "error"
implicit-import = "error"
invalid-decorator = "error"
name-mismatch = "error"
non-exhaustive-match = "error"
redundant-cast = "error"
redundant-condition = "error"
unnecessary-comparison = "error"
unnecessary-type-conversion = "error"
unreachable = "error"
unresolvable-dunder-all = "error"
variance-mismatch = "error"
# Off in the strict preset, on here. A return type is the half of a signature a caller reads
# first; inference checks the body either way, so this only asks that the contract be stated.
# Relaxed for tests below, where every `def test_*` returns None by construction.
unannotated-return = true
# A class holding an unimplemented abstract member says so, rather than failing at the one
# call site that instantiates it.
implicit-abstract-class = true
# Attributes are declared in the class body or `__init__`, not grown by whichever method
# happens to run first — which is also the only way a reader can find the full shape.
implicitly-defined-attribute = true
# Left off. pygments ships no stubs, so this fires six times on one import block and says
# only that a dependency is untyped — which we knew when we chose it.
untyped-import = false
# Left off. A lambda cannot carry annotations, so the only way to satisfy this is to rewrite
# each one as a `def` — a change to how the code reads, decided by a rule about inference.
# The containers these lambdas sit in are annotated, which is where the shape is stated.
implicit-any-lambda = false

# Tests, where an empty literal is usually a case rather than a container that outlives the
# line: `({}, {"thread": MAIN})` says "no arguments, then these" and annotating it says less.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any-empty-container = false
implicit-any-type-argument = false
implicit-any-parameter = false
# A `def test_*` returns None by construction, so `-> None` on all 91 of them is ceremony.
# This lifts the rule off the whole tree, fixtures included — but a fixture's return type is
# what the tests taking it read, and every fixture here annotates one already.
unannotated-return = false
